# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "General purpose PLL"             # Project title (e.g. "Simple CPU", "PLL", "ADC")
  team: "C4 Super Long Wave"                      # Your Team name
  discord: "Yutaka KOTANI"                   # Optional: Discord username (for support / communication)
  description: "General purpose PLL with Mosbius"  # Short one-line description
  lvs_config: "./DRC_dry_run/lvs_config.json"

  gf_def_ready: true            # data ready for def generation with global foundries' pad frame
  ws_def_ready: true            # data ready for def generation with wafer space pad frame
  drc_ready: false               # data ready for integration and DRC
  lvs_ready: false              # data ready for integrated LVS

pins:
  - name: RESET_N
    io_type: input_cmos
  - name: CLK
    io_type: input_cmos
  - name: CS_N
    io_type: input_cmos
  - name: DIN
    io_type: input_cmos
  - name: DOUT
    io_type: input_cmos
  - name: VDD
    io_type: power
  - name: VSS
    io_type: ground  # note: due to a common ground connection, ground pads are generally not needed.
  - name: ROW0_PLL_IN 
    io_type: analog
    secondary_esd: false
  - name: ROW1_PLL_OUT
    io_type: analog
    secondary_esd: false
  - name: ROW2_PLL_FB_IN
    io_type: analog
    secondary_esd: false
  - name: ROW3_VCO_IN
    io_type: analog
    secondary_esd: false
  - name: ROW4_TEST_OUT
    io_type: analog
    secondary_esd: false
  - name: ROW5_TEST_IN
    io_type: analog
    secondary_esd: false

